<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 230 800 840" role="img" aria-label="Happy Quanting">
  <!-- Vector redraw of Happy_Quanting _App_logo.svg (an embedded 1254px PNG): the H's two pillars
       with their slanted tops, crossed by a rising line that ends in a dot. Transparent background
       so it sits on both themes. -->
  <defs>
    <linearGradient id="hq-pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE8FD"/>
      <stop offset="1" stop-color="#E2D9FB"/>
    </linearGradient>
    <linearGradient id="hq-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9F7CFB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <path d="M277 335 L397 270 L397 1033 L277 1033 Z" fill="url(#hq-pillar)"/>
  <path d="M842 315 L965 262 L965 1030 L842 1030 Z" fill="url(#hq-pillar)"/>
  <polyline points="350,853 596,630 742,684 957,477" fill="none" stroke="url(#hq-line)"
            stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="350" cy="853" r="21" fill="#9F7CFB"/>
  <circle cx="957" cy="477" r="43" fill="#8B5CF6"/>
</svg>
